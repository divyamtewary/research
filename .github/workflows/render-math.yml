name: Render LaTeX Math to SVGs

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.html'

jobs:
  render-math:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Render LaTeX in Markdown files
        run: node .github/scripts/render-math-to-svg.js "**/*.md"

      - name: Render LaTeX in HTML files
        run: node .github/scripts/render-math-to-svg.js "**/*.html"

      - name: Commit and Push Rendered SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: auto-render latex math to proxy-friendly SVGs [skip ci]"
            git push
          else
            echo "No LaTeX changes detected. Skipping commit."
          fi