<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Research - questions, evidence and interactive artifacts">
  <title>Research</title>
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#17133A"/>
    </linearGradient>
    <linearGradient id="racc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55D6BE"/>
      <stop offset="50%" stop-color="#6EA8FE"/>
      <stop offset="100%" stop-color="#B48CFF"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.75" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#6EA8FE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6EA8FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#8CB4FF" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="rcard"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#rcard)">
    <rect width="1200" height="340" fill="url(#rbg)"/>
    <rect width="1200" height="340" fill="url(#rgrid)"/>
    <ellipse cx="900" cy="135" rx="410" ry="250" fill="url(#rglow)"/>
    <rect width="6" height="340" fill="url(#racc)"/>

    <text x="58" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="700" fill="#F4F7FF">research</text>
    <text x="60" y="127" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#A5B7D5">Questions first. Evidence next. Interactive artifacts when they help.</text>

    <g transform="translate(58,166)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="0" y="0" width="154" height="40" rx="10" fill="#0D2430" stroke="#55D6BE" stroke-opacity="0.55"/>
      <text x="77" y="25" text-anchor="middle" font-size="13" fill="#A8F0E0">questions</text>
      <line x1="154" y1="20" x2="188" y2="20" stroke="url(#racc)" stroke-width="2"/>
      <rect x="188" y="0" width="154" height="40" rx="10" fill="#111F38" stroke="#6EA8FE" stroke-opacity="0.55"/>
      <text x="265" y="25" text-anchor="middle" font-size="13" fill="#C5DBFF">evidence</text>
      <line x1="342" y1="20" x2="376" y2="20" stroke="url(#racc)" stroke-width="2"/>
      <rect x="376" y="0" width="154" height="40" rx="10" fill="#1A1739" stroke="#B48CFF" stroke-opacity="0.55"/>
      <text x="453" y="25" text-anchor="middle" font-size="13" fill="#DDCCFF">artifacts</text>
    </g>

    <g transform="translate(58,244)">
      <rect width="3" height="58" fill="url(#racc)"/>
      <text x="18" y="19" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#8192B0" letter-spacing="1.5">THE WORKING PRINCIPLE</text>
      <text x="18" y="45" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#F4F7FF">Make difficult ideas inspectable.</text>
    </g>

    <g transform="translate(815,62)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <path d="M40 210 C112 160 118 88 195 44 C260 7 326 42 354 102" fill="none" stroke="url(#racc)" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M40 210 C128 218 196 190 246 132 C289 82 321 105 354 102" fill="none" stroke="#55D6BE" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="40" cy="210" r="8" fill="#55D6BE"/>
      <circle cx="195" cy="44" r="8" fill="#6EA8FE"/>
      <circle cx="246" cy="132" r="8" fill="#B48CFF"/>
      <circle cx="354" cy="102" r="10" fill="#F4F7FF" stroke="#6EA8FE" stroke-width="3"/>
      <text x="8" y="239" font-size="12" fill="#8FA6C8">question</text>
      <text x="165" y="27" font-size="12" fill="#A8C9FF">method</text>
      <text x="221" y="157" font-size="12" fill="#D7C5FF">result</text>
      <text x="313" y="79" font-size="12" fill="#F4F7FF">insight</text>
    </g>
  </g>
</svg>
